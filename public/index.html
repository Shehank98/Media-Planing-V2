<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV Media Planner</title>
<meta name="description" content="Upload TV ratings data, explore dayparts, drill into channels and programs, build and test media plans. Your data stays in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230E6E78' stroke-width='2.2' stroke-linecap='round'%3E%3Crect x='3' y='5' width='18' height='12' rx='2'/%3E%3Cpath d='M8 21h8M12 17v4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <div class="brand"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div><span>TV Media Planner</span></div>
  <nav class="tabs" id="tabs" aria-label="Views">
    <button data-tab="overview" class="on">Overview</button>
    <button data-tab="explore">Explore</button>
    <button data-tab="drill">Drill down</button>
    <button data-tab="plan">Planner</button>
    <button data-tab="scen">Scenarios</button>
    <button data-tab="dup">Duplication</button>
    <button data-tab="data">Data</button>
  </nav>
  <div class="spacer"></div>
  <button class="period" id="periodBtn" title="Change date period">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
    <span><b id="periodTxt">No data</b><small id="periodSub"></small></span>
  </button>
  <button class="btn icon" id="dataBtn" title="Upload or manage data"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M4 17v3h16v-3"/></svg><span>Data</span></button>
  <button class="fbtn" id="filterBtn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>Filters<span class="badge" id="badge"></span></button>
  <button class="btn icon ai-btn" id="aiBtn" title="Ask Planner AI"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span>Planner AI</span></button>
  <button class="btn icon" id="themeBtn" title="Toggle light or dark theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>

<div class="fbar" id="fbar"></div>

<main id="main">
  <section class="view on" id="v-overview"></section>
  <section class="view" id="v-explore"></section>
  <section class="view" id="v-drill"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-scen"></section>
  <section class="view" id="v-dup"></section>
  <section class="view" id="v-data"></section>
  <section class="view" id="v-welcome"></section>
</main>

<div class="scrim" id="scrim"></div>

<!-- Filters and data drawer -->
<aside class="drawer" id="drawer" aria-label="Data and filters">
  <div class="dh"><h2>Data and filters</h2><button class="btn" id="closeD">Close</button></div>
  <div class="dtabs" id="dtabs">
    <button data-dt="upload" class="on">Data upload</button>
    <button data-dt="filters">Filters</button>
  </div>
  <div class="db" id="dbody"></div>
  <div class="df"><span class="cnt" id="dcount"></span><button class="btn" id="resetF">Reset filters</button><button class="btn pri" id="doneD">Done</button></div>
</aside>

<!-- Drill-down detail drawer -->
<aside class="drawer wide" id="detail" aria-label="Detail">
  <div class="dh"><div class="crumbs" id="crumbs"></div><button class="btn" id="closeX">Close</button></div>
  <div class="db" id="xbody"></div>
</aside>

<!-- Planner AI drawer -->
<aside class="drawer" id="ai" aria-label="Planner AI">
  <div class="dh"><h2>Planner AI</h2><span class="tag" id="aiMode">checking</span><button class="btn" id="closeAI">Close</button></div>
  <div class="db ai-body">
    <div class="ctx" id="aiCtx"></div>
    <div class="sugg" id="aiSugg">
      <button>Cut budget 25%</button>
      <button>Best weekend slot?</button>
      <button>Programs at 10 PM</button>
      <button>Add a Tamil option</button>
      <button>Why does the top channel get its share?</button>
      <button>Any daytime sleeper hits?</button>
      <button>Use 3 channels</button>
      <button>Write a planner memo for the client</button>
    </div>
    <div id="aiLog" class="ai-log" aria-live="polite"></div>
  </div>
  <form class="ai-inp" id="aiForm"><input id="aiQ" type="text" placeholder="Ask about splits, slots, programs…" autocomplete="off"><button class="btn pri">Send</button></form>
  <div class="foot" style="padding:0 14px 10px">AI suggestions never change your plan until you click Apply. Only a summary of the filtered numbers is sent, never your file.</div>
</aside>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
